# Runs the WPT evaluator benchmark on Cloud Build. Triggered on pull requests
# via standard `/gcbrun` comment control, automatically on push to `main`, or
# manually (`gcloud builds submit`). Authenticates using the Cloud Build service
# account identity (Vertex AI ADC) and publishes reports to PR comments and GitHub Checks.
#
# Two tiers, selected by substitutions (defaults = regression / smoke for PRs):
#   Regression (default)  the manifest's `smoke` sets only, 3 repeats, gated on seed
#                         recall. Fast regression guard on PRs and `main`.
#   Release               full manifest, 8 repeats, gated on corpus stability
#                         (`auto`, the 8-repeat target). Establishes the
#                         consistency band; run before a corpus/skill release.
#                           gcloud builds submit --config cloudbuild.yaml \
#                             --substitutions=_SELECT="",_REPEATS=8,_MIN_RECALL="",_MIN_STABILITY=auto,_JOBS=4
#
# Substitutions:
#   _PROVIDER       provider to evaluate with (blank = config default)
#   _JOBS           concurrent evaluator runs (default: 8)
#   _REPEATS        repeats per entry (default: 3 for regression, 8 for release)
#   _SELECT         entry selection (default: `--smoke` for PRs; blank for full manifest)
#   _MIN_RECALL     seed-recall gate (default: `1.0` for regression; blank for release)
#   _MIN_STABILITY  corpus-stability gate: `auto` (repeat-aware target) or a
#                   float floor; blank = off. Prefer `auto`. Default blank on the
#                   regression tier (3 reps has too few samples to fail on);
#                   set `auto` on the release tier (8 reps).
#   _WPT_PIN        wpt commit to check out; keep in sync with
#                   benchmarks/manifest.yaml:wpt_upstream_commit
substitutions:
  _PROVIDER: ''
  _JOBS: '16'
  _REPEATS: '8'
  _SELECT: ''
  _MIN_RECALL: '1.0'
  _MIN_STABILITY: 'auto'
  _WPT_PIN: 'f5a7deaba2bffac7a534dfafaa3baf14b9a253cf'
  _PR_NUMBER: ''

steps:
  - id: clone-wpt
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - |
        git clone --filter=blob:none \
          https://github.com/web-platform-tests/wpt.git /workspace/wpt
        git -C /workspace/wpt checkout "${_WPT_PIN}"

  # Install and run in one Python step so the venv/deps persist across the
  # invocation. Authenticates natively with Vertex AI via the service account
  # identity (Application Default Credentials).
  - id: run-benchmark
    name: python:3.13-slim
    entrypoint: bash
    env:
      - 'GOOGLE_GENAI_USE_VERTEXAI=true'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
      - 'GOOGLE_CLOUD_LOCATION=global'
      - 'COMMIT_SHA=$COMMIT_SHA'
      - 'PR_NUMBER=$_PR_NUMBER'
      - 'HEAD_BRANCH=$_HEAD_BRANCH'
      - 'BRANCH_NAME=$BRANCH_NAME'
      - 'REPO_NAME=$REPO_FULL_NAME'
    secretEnv: ['GH_TOKEN']
    args:
      - -c
      - |
        set -uo pipefail
        apt-get update && apt-get install -y --no-install-recommends git gh
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

        # Run benchmark and capture exit code so the report is always output
        set +e
        provider_arg=""
        if [ -n "${_PROVIDER}" ]; then
          provider_arg="--provider ${_PROVIDER}"
        fi
        recall_arg=""
        if [ -n "${_MIN_RECALL}" ]; then
          recall_arg="--min-recall ${_MIN_RECALL}"
        fi
        stability_arg=""
        if [ -n "${_MIN_STABILITY}" ]; then
          stability_arg="--min-stability ${_MIN_STABILITY}"
        fi

        python scripts/benchmark/run_benchmark.py \
          --manifest benchmarks/manifest.yaml \
          --wpt-dir /workspace/wpt \
          --jobs "${_JOBS}" \
          --repeats "${_REPEATS}" \
          ${_SELECT} \
          $${provider_arg} \
          $${recall_arg} \
          $${stability_arg}
        bench_status=$$?
        set -e

        latest_report=$$(find bench-runs -name "report.md" 2>/dev/null | sort -r | head -n 1)
        if [ -n "$${latest_report}" ] && [ -f "$${latest_report}" ]; then
          echo "=================== BENCHMARK REPORT ==================="
          cat "$${latest_report}"
          echo "========================================================"

          # 1. Post comment to PR (if running in a pull request context)
          pr_target="$${PR_NUMBER:-$${HEAD_BRANCH:-$${BRANCH_NAME}}}"
          if [ -n "$${pr_target}" ] && [ "$${pr_target}" != "main" ] && [ -n "$${GH_TOKEN:-}" ]; then
            # Resolve PR number if a branch name was passed from a fork
            if ! [[ "$${pr_target}" =~ ^[0-9]+$$ ]]; then
              resolved_pr=$$(gh pr list --repo "$${REPO_NAME:-GoogleChromeLabs/wpt-gen}" --head "$${pr_target}" --json number -q '.[0].number' 2>/dev/null || true)
              if [ -n "$${resolved_pr}" ]; then
                pr_target="$${resolved_pr}"
              fi
            fi
            echo "Posting benchmark report to PR ($${pr_target})..."
            gh pr comment "$${pr_target}" \
              --repo "$${REPO_NAME:-GoogleChromeLabs/wpt-gen}" \
              --body-file "$${latest_report}" || true
          fi
        fi

        exit "$${bench_status}"

# Agent calls are slow; cap the build rather than let it hang. The release tier
# (~240 runs) can approach this; drop it for the smaller regression tier.
timeout: 14400s

options:
  machineType: 'E2_HIGHCPU_32'
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/interop-bot-gh-token/versions/latest
      env: 'GH_TOKEN'


